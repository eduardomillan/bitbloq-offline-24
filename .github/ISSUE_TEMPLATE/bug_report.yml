name: 🐞 Bug report
description: Report a problem with Bitbloq Offline (include the RC version you are testing)
title: "[Bug] <short summary>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill this out so we can reproduce and fix it.
        If you are testing a Release Candidate, mention the exact version from `package.json` or the GitHub release tag.
  - type: input
    id: version
    attributes:
      label: Bitbloq Offline version
      description: e.g. 1.3.0-rc.1 (from Help/About or the release tag)
      placeholder: "1.3.0-rc.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (64-bit)
        - Windows (64-bit)
        - Windows (32-bit)
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      description: e.g. Ubuntu 22.04, Lliurex 23, Windows 10, macOS 13
      placeholder: "Ubuntu 22.04"
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Affected hardware (if any)
      description: Board/robot you were using when the bug happened
      options:
        - "Arduino UNO / MEGA / Leonardo / Nano"
        - "BQ ZUM / BQ ZUM Box"
        - "Makeblock (mBot, mCore, Me Auriga, mRanger...)"
        - "eBotics / FreaksCar / Ranger"
        - "Zowi"
        - "Web2Board download/install"
        - "Not hardware related (UI / editor / other)"
        - "Other"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: 1. ... 2. ... 3. ...
      placeholder: |
        1. Open Bitbloq Offline
        2. Connect board X
        3. Click "Upload"
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Paste any console output, Web2Board logs, or error dialogs.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have checked that this is not already reported
          required: true
        - label: I have tried the latest RC (1.3.0-rc.1 or newer)
          required: true
