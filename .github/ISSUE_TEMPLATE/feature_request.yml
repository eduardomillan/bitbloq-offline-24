name: 💡 Feature request
description: Suggest an improvement, board/robot support, or language for Bitbloq Offline
title: "[Feature] <short summary>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: A clear description of the need or limitation you are facing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / idea
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "New board / robot support"
        - "New language / translation"
        - "Web2Board (flashing / compiler)"
        - "Editor / bloqs / blocks"
        - "Installer / packaging"
        - "UI / UX"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, references, or board specs.
    validations:
      required: false
