name: Release web2board

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (debe coincidir con releaseTag en web2board-download.json)'
        required: true
        default: 'web2board-v2.1.3'
  push:
    tags:
      - 'web2board-v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install build dependencies (skip bower postinstall)
        run: npm install --ignore-scripts

      - name: Package web2board
        run: npx grunt package-web2board

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: List artifacts
        run: ls -lh dist/web2board

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          ASSETS="dist/web2board/web2board-linux-x64.zip dist/web2board/web2board-win32.zip dist/web2board/web2board-manifest.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG ya existe, subiendo/actualizando assets..."
            gh release upload "$TAG" $ASSETS --clobber
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" $ASSETS \
              --title "web2board $TAG" \
              --notes "web2board empaquetado por separado (v2.1.3) para descarga bajo demanda por Bitbloq Offline slim."
          fi
